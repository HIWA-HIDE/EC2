name: Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan dependencies (package.json/lock), Dockerfile misconfig, and
      # any accidentally committed secrets.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"

      # Build the image locally just to scan it - never pushed anywhere.
      - name: Build image for scanning
        run: docker build -t scan-target:latest .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "scan-target:latest"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"

  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Spin up a throwaway copy of the app (built from source, with
      # dummy DB credentials) so ZAP has a live target to attack. This
      # never touches your real EC2 deployment or real secrets.
      - name: Start the app for scanning
        run: |
          docker compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for the app to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "App is up."
              break
            fi
            sleep 2
          done

      - name: Prepare report files
        run: |
          touch report_json.json report_md.md report_html.html
          chmod a+w report_json.json report_md.md report_html.html

      # Run ZAP directly instead of via zaproxy/action-baseline - that
      # action's own artifact-upload step is currently broken against
      # GitHub's current backend. This is the same scan, run manually.
      - name: Run OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -J report_json.json -w report_md.md -r report_html.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
  tfsec:
    name: Terraform scan (tfsec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans the Terraform source (not state) for misconfigurations:
      # open security groups, unencrypted volumes, missing IMDSv2, etc.
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true  # warn first; flip to false once findings are clean
        with:
          working_directory: terraform-codes